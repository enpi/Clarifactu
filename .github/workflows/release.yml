name: Release

# Every push to master publishes a new version:
#   - If package.json's version has no tag yet (you bumped it by hand, e.g. to a
#     new minor), that version is released as-is.
#   - Otherwise the patch number is bumped automatically (1.2.2 -> 1.2.3).
# The bump is committed back to master and tagged, then the Windows installers
# are built and published as a GitHub Release (where the auto-updater finds them).
#
# Pushes that only touch docs are ignored. Add [skip ci] to a commit message to
# push without releasing. After each release run `git pull` to get the bump commit.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, never cancel a half-published one
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24  # same Node as Electron 45; better-sqlite3 13 needs >= 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron 45 no longer downloads its binary on install. Fetch it through the GitHub API
      # (gh), which kept working while direct release downloads returned 504, and check it
      # against the checksums shipped inside the electron package.
      - name: Install Electron binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$(node -p "require('electron/package.json').version")"
          Z="electron-v$V-win32-x64.zip"
          for i in 1 2 3; do
            gh release download "v$V" -R electron/electron -p "$Z" -D "$RUNNER_TEMP" --clobber && break
            echo "Download attempt $i failed, retrying in 20 s"; sleep 20
          done
          echo "$(node -p "require('electron/checksums.json')['$Z']")  $RUNNER_TEMP/$Z" | sha256sum -c -
          rm -rf node_modules/electron/dist
          unzip -q "$RUNNER_TEMP/$Z" -d node_modules/electron/dist
          printf 'electron.exe' > node_modules/electron/path.txt
          cat node_modules/electron/dist/version

      # Never ship a release with a known high or critical vulnerability (Electron itself
      # is a devDependency but ends up inside the installer, so the whole tree is checked)
      - name: Security audit
        run: npm audit --audit-level=high

      # better-sqlite3 13 is Node-API: the same binary runs in Node (tests) and Electron (app)
      - name: Unit tests
        run: npm run test:unit

      # Bump the patch version, unless the current one has a tag but no release yet
      # (a previous run failed after tagging): then release that version.
      - name: Decide version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/v$CURRENT" >/dev/null && gh release view "v$CURRENT" >/dev/null 2>&1; then
            npm version patch --no-git-tag-version >/dev/null
          fi
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      # electron-builder downloads its toolsets (7-Zip, NSIS) from GitHub releases, which
      # returned 504 on these runners. Fetch them through the API (gh) and serve them from a
      # localhost mirror; electron-builder still verifies their checksums.
      - name: Fetch build tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          M="$RUNNER_TEMP/builder-mirror"
          while read -r rel file; do
            mkdir -p "$M/$rel"
            for i in 1 2 3; do
              gh release download "$rel" -R electron-userland/electron-builder-binaries -p "$file" -D "$M/$rel" --clobber && break
              echo "Download of $file failed (attempt $i), retrying in 20 s"; sleep 20
            done
            test -s "$M/$rel/$file"
          done <<'EOF'
          7zip@1.0.0 7zip-win-x64.tar.gz
          nsis-3.0.4.1 nsis-3.0.4.1.7z
          nsis-resources-3.4.1 nsis-resources-3.4.1.7z
          winCodeSign-2.6.0 winCodeSign-2.6.0.7z
          EOF

      # Build before tagging, so a failed build never leaves a tag without a release.
      # Electron comes from node_modules (build.electronDist).
      - name: Build installer
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: http://127.0.0.1:47123/
          ELECTRON_BUILDER_BINARIES_ALLOW_HTTP: 'true'
        run: |
          node scripts/serve-dir.js "$RUNNER_TEMP/builder-mirror" 47123 > "$RUNNER_TEMP/mirror.log" 2>&1 &
          sleep 2
          ok=1
          for i in 1 2 3; do
            npx electron-builder --win --x64 --publish never && { ok=0; break; }
            echo "Build attempt $i failed, retrying in 30 s"; sleep 30
          done
          echo "--- mirror requests ---"; cat "$RUNNER_TEMP/mirror.log"
          exit $ok

      - name: Commit and tag version
        run: |
          V="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package.json package-lock.json; then
            git commit -m "chore: release v$V [skip ci]" -- package.json package-lock.json
          fi
          git pull --rebase --autostash origin master
          git rev-parse -q --verify "refs/tags/v$V" >/dev/null || git tag "v$V"
          git push origin HEAD:master "v$V"

      # Upload through the GitHub API with the asset names the auto-updater expects
      # (electron-builder used to publish them with dashes instead of spaces)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp "dist/Clarifactu Setup $V.exe" "release/Clarifactu-Setup-$V.exe"
          cp "dist/Clarifactu Setup $V.exe.blockmap" "release/Clarifactu-Setup-$V.exe.blockmap"
          cp "dist/Clarifactu $V.exe" "release/Clarifactu-$V.exe"
          cp dist/latest.yml release/latest.yml
          grep -q "url: Clarifactu-Setup-$V.exe" release/latest.yml
          gh release create "v$V" release/* --title "$V" --notes ""
